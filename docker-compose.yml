services:
  postgres:
    image: postgres:18
    container_name: norvixhub-postgres
    environment:
      POSTGRES_DB: norvixhub
      POSTGRES_USER: norvixhub
      POSTGRES_PASSWORD: norvixhub_dev_password
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norvixhub -d norvixhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: norvixhub-azurite
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0"
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: norvixhub-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  erp-receiver:
    build:
      context: .
      dockerfile: backend/src/NorvixHub.ErpDemoReceiver/Dockerfile
    container_name: norvixhub-erp-receiver
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__ErpDemoReceiver: Data Source=/data/erp-demo-receiver.db
      ErpDemoReceiver__SigningSecret: ${ERP_DEMO_SIGNING_SECRET:?Set ERP_DEMO_SIGNING_SECRET in the ignored .env file}
      ErpDemoReceiver__EnableFailOnce: "true"
    ports:
      - "127.0.0.1:5510:8080"
    volumes:
      - erp-receiver-data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - internal
      - local-access

networks:
  internal:
    internal: true
  local-access:

volumes:
  postgres-data:
  azurite-data:
  erp-receiver-data:
