services:
  postgres:
    image: postgres:18
    container_name: norvixhub-postgres
    environment:
      POSTGRES_DB: norvixhub
      POSTGRES_USER: norvixhub
      POSTGRES_PASSWORD: norvixhub_dev_password
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norvixhub -d norvixhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: norvixhub-azurite
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0"
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: norvixhub-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  azurite-data:
