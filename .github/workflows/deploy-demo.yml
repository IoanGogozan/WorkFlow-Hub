name: Deploy Demo

on:
  workflow_dispatch:
    inputs:
      confirm_no_real_customer_data:
        description: "Confirm the demo deployment uses fictional/demo-safe data only."
        required: true
        type: boolean
      deploy_note:
        description: "Optional deployment note."
        required: false
        type: string
  push:
    tags:
      - "demo-*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  gate:
    name: Demo deploy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require main branch for manual deploys
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        run: |
          echo "Manual demo deployment is allowed only from main."
          exit 1
      - name: Require fictional data confirmation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_no_real_customer_data != true }}
        run: |
          echo "Demo deployment requires confirmation that only fictional/demo-safe data is used."
          exit 1
      - name: Gate summary
        run: |
          echo "Ref: $GITHUB_REF"
          echo "Demo deploy gate passed."

  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore backend/NorvixHub.sln
      - name: Build
        run: dotnet build backend/NorvixHub.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test backend/NorvixHub.sln --configuration Release --no-build -nr:false --logger "trx;LogFileName=backend-tests.trx" --results-directory TestResults
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-backend-test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
      - name: Restore .NET tools
        run: dotnet tool restore --tool-manifest dotnet-tools.json
      - name: Check EF migrations
        run: dotnet tool run dotnet-ef -- migrations has-pending-model-changes --project backend/src/NorvixHub.Infrastructure/NorvixHub.Infrastructure.csproj --startup-project backend/src/NorvixHub.Api/NorvixHub.Api.csproj --configuration Release

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        env:
          ERP_DEMO_SIGNING_SECRET: deploy-compose-validation-only-secret-32-bytes
        run: docker compose config --quiet

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose]
    environment: demo
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
      API_CONTAINER_APP: ${{ vars.AZURE_API_CONTAINER_APP }}
      WORKER_CONTAINER_APP: ${{ vars.AZURE_WORKER_CONTAINER_APP }}
      FRONTEND_CONTAINER_APP: ${{ vars.AZURE_FRONTEND_CONTAINER_APP }}
      DEMO_API_BASE_URL: ${{ vars.DEMO_API_BASE_URL }}
      DEMO_FRONTEND_URL: ${{ vars.DEMO_FRONTEND_URL }}
      DEMO_BLOB_CONTAINER: ${{ vars.DEMO_BLOB_CONTAINER || 'documents' }}
      POSTGRES_CONNECTION: ${{ secrets.DEMO_POSTGRES_CONNECTION_STRING }}
      BLOB_CONNECTION: ${{ secrets.DEMO_BLOB_CONNECTION_STRING }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Azure deployment settings
        run: |
          required=(
            RESOURCE_GROUP
            ACR_NAME
            ACR_LOGIN_SERVER
            API_CONTAINER_APP
            WORKER_CONTAINER_APP
            FRONTEND_CONTAINER_APP
            DEMO_API_BASE_URL
            POSTGRES_CONNECTION
            BLOB_CONNECTION
          )

          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "$name is required for demo deployment."
              exit 1
            fi
          done
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Log in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"
      - name: Build and push API image
        run: |
          image="$ACR_LOGIN_SERVER/norvixhub-api:$GITHUB_SHA"
          docker build -f backend/src/NorvixHub.Api/Dockerfile -t "$image" .
          docker push "$image"
      - name: Build and push worker image
        run: |
          image="$ACR_LOGIN_SERVER/norvixhub-worker:$GITHUB_SHA"
          docker build -f backend/src/NorvixHub.Worker/Dockerfile -t "$image" .
          docker push "$image"
      - name: Build and push frontend image
        run: |
          image="$ACR_LOGIN_SERVER/norvixhub-frontend:$GITHUB_SHA"
          docker build \
            -f frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL="$DEMO_API_BASE_URL" \
            -t "$image" .
          docker push "$image"
      - name: Configure API secrets
        run: |
          az containerapp secret set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$API_CONTAINER_APP" \
            --secrets \
              postgres-connection="$POSTGRES_CONNECTION" \
              blob-connection="$BLOB_CONNECTION"
      - name: Configure worker secrets
        run: |
          az containerapp secret set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WORKER_CONTAINER_APP" \
            --secrets \
              postgres-connection="$POSTGRES_CONNECTION" \
              blob-connection="$BLOB_CONNECTION"
      - name: Deploy API
        run: |
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$API_CONTAINER_APP" \
            --image "$ACR_LOGIN_SERVER/norvixhub-api:$GITHUB_SHA" \
            --set-env-vars \
              ASPNETCORE_ENVIRONMENT=Demo \
              ASPNETCORE_HTTP_PORTS=8080 \
              ConnectionStrings__Postgres=secretref:postgres-connection \
              Storage__Provider=AzureBlob \
              Storage__AzureBlob__ConnectionString=secretref:blob-connection \
              Storage__AzureBlob__Container="$DEMO_BLOB_CONTAINER" \
              Database__ApplyMigrationsOnStartup=true \
              Deployment__ForwardedHeadersEnabled=true \
              Deployment__EnforceHttps=true \
              Deployment__AllowUnknownProxies=true
      - name: Smoke test API readiness
        run: |
          curl --fail --retry 12 --retry-all-errors --retry-delay 10 "${DEMO_API_BASE_URL%/}/health/ready"
      - name: Deploy worker
        run: |
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WORKER_CONTAINER_APP" \
            --image "$ACR_LOGIN_SERVER/norvixhub-worker:$GITHUB_SHA" \
            --set-env-vars \
              DOTNET_ENVIRONMENT=Demo \
              ConnectionStrings__Postgres=secretref:postgres-connection \
              Storage__Provider=AzureBlob \
              Storage__AzureBlob__ConnectionString=secretref:blob-connection \
              Storage__AzureBlob__Container="$DEMO_BLOB_CONTAINER" \
              DemoSessionCleanup__Enabled=true
      - name: Deploy frontend
        run: |
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_CONTAINER_APP" \
            --image "$ACR_LOGIN_SERVER/norvixhub-frontend:$GITHUB_SHA" \
            --set-env-vars \
              NODE_ENV=production \
              PORT=3000 \
              NEXT_PUBLIC_API_BASE_URL="$DEMO_API_BASE_URL"
      - name: Smoke test frontend
        if: ${{ vars.DEMO_FRONTEND_URL != '' }}
        run: |
          curl --fail --retry 12 --retry-all-errors --retry-delay 10 "${DEMO_FRONTEND_URL%/}/demo"
      - name: Deployment summary
        run: |
          echo "Deployed demo images:"
          echo "$ACR_LOGIN_SERVER/norvixhub-api:$GITHUB_SHA"
          echo "$ACR_LOGIN_SERVER/norvixhub-worker:$GITHUB_SHA"
          echo "$ACR_LOGIN_SERVER/norvixhub-frontend:$GITHUB_SHA"
