name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore backend/NorvixHub.sln
      - name: Build
        run: dotnet build backend/NorvixHub.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test backend/NorvixHub.sln --configuration Release --no-build -nr:false --logger "trx;LogFileName=backend-tests.trx" --results-directory TestResults
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
      - name: Restore .NET tools
        run: dotnet tool restore --tool-manifest dotnet-tools.json
      - name: Check EF migrations
        run: dotnet tool run dotnet-ef -- migrations has-pending-model-changes --project backend/src/NorvixHub.Infrastructure/NorvixHub.Infrastructure.csproj --startup-project backend/src/NorvixHub.Api/NorvixHub.Api.csproj --configuration Release

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose config --quiet

  verifiable-demo-e2e:
    name: Verifiable demo E2E
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: workflow-hub
      POSTGRES_DB: norvixhub
      POSTGRES_USER: norvixhub
      POSTGRES_PASSWORD: ci-only-postgres-password
      WORKFLOW_HUB_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate ERP signing secret
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "ERP_DEMO_SIGNING_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Create isolated proxy network
        run: docker network inspect proxy >/dev/null 2>&1 || docker network create proxy
      - name: Validate E2E Compose
        run: docker compose -f compose.home-server.yml -f compose.ci.yml config --quiet
      - name: Start E2E services
        run: docker compose -f compose.home-server.yml -f compose.ci.yml up -d --build --wait --wait-timeout 240
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify live demo and evidence in browser
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: >-
          npx playwright test
          e2e/live-preview.spec.ts
          e2e/live-run-evidence.spec.ts
          e2e/sharepoint-technical.spec.ts
          --project=chromium
      - name: Verify normal, fail-retry, and tenant-isolation contracts
        run: >-
          dotnet test backend/tests/NorvixHub.IntegrationTests/NorvixHub.IntegrationTests.csproj
          --configuration Release
          --filter "FullyQualifiedName~FullVerifiableIntegrationTests|FullyQualifiedName~LiveDemoEvidence_returns_not_found_for_another_tenant"
          --logger "trx;LogFileName=verifiable-demo-e2e.trx"
          --results-directory TestResults
      - name: Capture service logs
        if: failure()
        run: docker compose -f compose.home-server.yml -f compose.ci.yml logs --no-color > verifiable-demo-services.log
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifiable-demo-e2e-results
          path: |
            TestResults/**/*.trx
            frontend/playwright-report/
            frontend/test-results/
            verifiable-demo-services.log
          if-no-files-found: ignore
      - name: Stop E2E services
        if: always()
        run: docker compose -f compose.home-server.yml -f compose.ci.yml down --volumes --remove-orphans

  deploy-readiness:
    name: Deploy readiness
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose, verifiable-demo-e2e]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Gate summary
        run: |
          echo "Backend, frontend, Compose, and verifiable demo E2E checks passed."
          echo "Demo deployment is allowed only through the Deploy Demo workflow with the demo environment gate."
