name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore backend/NorvixHub.sln
      - name: Build
        run: dotnet build backend/NorvixHub.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test backend/NorvixHub.sln --configuration Release --no-build -nr:false --logger "trx;LogFileName=backend-tests.trx" --results-directory TestResults
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
      - name: Restore .NET tools
        run: dotnet tool restore --tool-manifest dotnet-tools.json
      - name: Check EF migrations
        run: dotnet tool run dotnet-ef -- migrations has-pending-model-changes --project backend/src/NorvixHub.Infrastructure/NorvixHub.Infrastructure.csproj --startup-project backend/src/NorvixHub.Api/NorvixHub.Api.csproj --configuration Release

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose config --quiet

  deploy-readiness:
    name: Deploy readiness
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Gate summary
        run: |
          echo "Backend tests, EF migration check, frontend audit/lint/build, and Docker Compose validation passed."
          echo "Demo deployment is allowed only through the Deploy Demo workflow with the demo environment gate."
